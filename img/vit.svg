<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <rect width="640" height="400" fill="#EEF1F7"/>
  <!-- an image cut into 16 patches: the core idea of a Vision Transformer -->
  <g transform="translate(78 96)">
    <rect x="-6" y="-6" width="220" height="220" rx="10" fill="#fff"/>
    <g fill="#3B4C73">
      <rect x="0" y="0" width="49" height="49" rx="4" opacity=".92"/><rect x="53" y="0" width="49" height="49" rx="4" opacity=".70"/>
      <rect x="106" y="0" width="49" height="49" rx="4" opacity=".50"/><rect x="159" y="0" width="49" height="49" rx="4" opacity=".30"/>
      <rect x="0" y="53" width="49" height="49" rx="4" opacity=".72"/><rect x="53" y="53" width="49" height="49" rx="4" fill="#0C6E63"/>
      <rect x="106" y="53" width="49" height="49" rx="4" opacity=".38"/><rect x="159" y="53" width="49" height="49" rx="4" opacity=".55"/>
      <rect x="0" y="106" width="49" height="49" rx="4" opacity=".48"/><rect x="53" y="106" width="49" height="49" rx="4" opacity=".28"/>
      <rect x="106" y="106" width="49" height="49" rx="4" opacity=".64"/><rect x="159" y="106" width="49" height="49" rx="4" opacity=".82"/>
      <rect x="0" y="159" width="49" height="49" rx="4" opacity=".26"/><rect x="53" y="159" width="49" height="49" rx="4" opacity=".58"/>
      <rect x="106" y="159" width="49" height="49" rx="4" opacity=".86"/><rect x="159" y="159" width="49" height="49" rx="4" opacity=".44"/>
    </g>
  </g>
  <path d="M322 200h58" stroke="#3B4C73" stroke-width="3" stroke-linecap="round"/>
  <path d="M372 190l12 10-12 10" fill="none" stroke="#3B4C73" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- tokens, then a quantised version of the same: fewer bits, same shape -->
  <g transform="translate(408 118)">
    <g fill="#3B4C73">
      <rect y="0" width="150" height="22" rx="5" opacity=".85"/><rect y="34" width="150" height="22" rx="5" opacity=".62"/>
      <rect y="68" width="150" height="22" rx="5" fill="#0C6E63"/><rect y="102" width="150" height="22" rx="5" opacity=".44"/>
      <rect y="136" width="150" height="22" rx="5" opacity=".72"/>
    </g>
    <g fill="#fff" opacity=".55">
      <rect x="38" y="0" width="2" height="158"/><rect x="76" y="0" width="2" height="158"/><rect x="114" y="0" width="2" height="158"/>
    </g>
  </g>
</svg>
